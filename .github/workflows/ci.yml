name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            integrations/pop-core/validator/package-lock.json
            app/package-lock.json

      - name: Install validator dependencies
        working-directory: integrations/pop-core/validator
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Production readiness smoke
        run: ./scripts/smoke_production_readiness.sh

      - name: Vision prep smoke
        run: ./scripts/smoke_vision_prep.sh

      - name: Build production artifacts
        run: ./scripts/build_production_artifacts.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-artifacts
          path: .artifacts/*
