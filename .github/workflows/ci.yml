name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            integrations/pop-core/validator/package-lock.json
            app/package-lock.json

      - name: POP validator tests
        working-directory: integrations/pop-core/validator
        run: npm ci && npm test

      - name: App typecheck and build
        working-directory: app
        run: npm ci && npm run typecheck && npm run build

      - name: Local-json wallet smoke
        run: ./scripts/smoke_pop_wallet_loop.sh

      - name: Proof events SSE smoke
        run: ./scripts/smoke_proof_events.sh
