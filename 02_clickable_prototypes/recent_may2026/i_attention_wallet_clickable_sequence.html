.phoneWrap{display:grid;place-items:center}.phone{width:min(390px,38vw);height:min(760px,72vh);min-width:320px;min-height:620px;border-radius:48px;border:1px solid rgba(255,255,255,.16);background:#050607;box-shadow:0 40px 90px rgba(0,0,0,.65),inset 0 0 0 8px rgba(255,255,255,.025);position:relative;overflow:hidden;cursor:pointer}.phone:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:30px;border:1px solid rgba(255,255,255,.1);border-top:0;border-radius:0 0 18px 18px;background:#090a0c;z-index:10}.screen{position:absolute;inset:18px 14px 18px;border-radius:36px;overflow:hidden;background:linear-gradient(180deg,#0c1013,#060708);padding:28px 18px 20px;display:flex;flex-direction:column}.status{font-family:var(--mono);font-size:10px;color:#fff;display:flex;justify-content:space-between;opacity:.82;margin-bottom:18px}.screenTitle{font-size:19px;font-weight:750;letter-spacing:-.04em;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin:0 0 14px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);padding:6px 10px;border-radius:999px;font-size:11px;color:var(--muted)}.green{color:var(--green)}.mono{font-family:var(--mono)}
.info{min-width:0}.kicker{font-family:var(--mono);color:var(--green);font-size:13px;text-transform:uppercase;letter-spacing:.12em}.info h2{font-size:clamp(34px,4vw,64px);line-height:.96;margin:10px 0 18px;letter-spacing:-.07em}.desc{font-size:18px;line-height:1.65;color:#d2d6d0;max-width:760px;margin:0 0 26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border-radius:20px;padding:18px}.card h3{margin:0 0 10px;color:var(--green);font-size:14px;text-transform:uppercase;letter-spacing:.05em}.card p,.card li{color:#c7cbc5;font-size:14px;line-height:1.55}.card ul{margin:0;padding-left:18px}.takeaway{margin-top:14px;border-color:rgba(152,241,47,.38);background:linear-gradient(180deg,rgba(152,241,47,.08),rgba(255,255,255,.025))}.takeaway strong{color:#fff}
.nav{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.dot{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#e9ede8;display:grid;place-items:center;font-size:12px;font-family:var(--mono);cursor:pointer}.dot.active{background:var(--green);color:#081007;border-color:var(--green);box-shadow:0 0 24px rgba(152,241,47,.22)}.label{font-size:11px;color:var(--muted);margin-right:8px}.progress{height:2px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;max-width:720px;width:50vw}.bar{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:0%;transition:.3s}
/* Phone screen drawings */
.logoCenter{margin:auto;display:grid;place-items:center;text-align:center;gap:26px}.ringLogo{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(152,241,47,.12),transparent 34%),repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 1px,transparent 1px 42px)}.ringLogo span{font-family:var(--mono);font-size:46px;color:var(--green)}.cta{margin-top:auto;background:rgba(255,255,255,.1);border:1px solid var(--line);height:52px;border-radius:999px;display:grid;place-items:center;font-weight:700}.cta.greenBtn{background:linear-gradient(180deg,var(--green),#83e92a);color:#081007;border:0}.stories{display:flex;gap:9px;margin:8px 0 12px}.story{width:42px;height:42px;border-radius:50%;border:2px solid var(--green);background:linear-gradient(140deg,#1b2629,#111);display:grid;place-items:center;font-size:10px}.filters{display:flex;gap:6px;margin-bottom:12px}.filter{font-size:10px;padding:6px 9px;border-radius:999px;background:#1a1d22;color:#cfd3cf}.filter.active{background:var(--green);color:#071007}.feedcard{border:1px solid var(--line);background:#12161b;border-radius:18px;overflow:hidden;margin-bottom:12px}.media{height:112px;background:linear-gradient(135deg,#0d1f18,#111b22);display:grid;place-items:center;position:relative}.play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}.play:before{content:"";border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}.feedbody{padding:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.reward{font-family:var(--mono);color:var(--green);font-weight:700}.shoe{font-size:82px;filter:grayscale(.1)}.metricBox{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:14px;margin:10px 0}.miniRows{display:grid;gap:10px}.miniRow{display:flex;justify-content:space-between;font-size:12px;color:#c9cec8}.attention{margin:auto;display:grid;place-items:center;gap:16px}.bigRing{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 78%,rgba(255,255,255,.08) 78% 100%);position:relative}.bigRing:after{content:"";position:absolute;inset:16px;border-radius:50%;background:#0b0e10}.score{position:relative;z-index:2;text-align:center}.score b{font-size:56px}.timeline{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.timeline span{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--cyan),var(--green))}.gate{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:14px;padding:12px;margin-bottom:10px}.check{width:28px;height:28px;border-radius:8px;background:var(--green);color:#081007;display:grid;place-items:center;font-weight:900}.coin{margin:auto;display:grid;place-items:center;text-align:center}.coinOrb{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--green),#d7ff57 42%,#5a9d16 43%,rgba(152,241,47,.12) 60%,transparent 70%);box-shadow:0 0 70px rgba(152,241,47,.35)}.coinOrb span{font-family:var(--mono);font-size:44px;color:#173100}.balance{font-family:var(--mono);font-size:40px;letter-spacing:-.05em}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.action{background:#171b21;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center;font-size:11px}.split{display:grid;gap:9px}.splitLine{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.splitLine span{display:block;height:100%;background:var(--green)}.roadlist{display:grid;gap:8px}.roaditem{display:flex;gap:9px;align-items:center;color:#cfd3cf;font-size:13px}.hidden{display:none}
@media(max-width:900px){body{overflow:auto}.app{height:auto}.stage{grid-template-columns:1fr}.phone{width:min(390px,92vw);height:690px}.grid{grid-template-columns:1fr}.progress{display:none}.controls{justify-content:flex-start}}
</style>

<script>
const screens=[
{n:1,id:'Splash',title:'Splash Screen',desc:'The first impression of the [ i ] Attention Wallet. It establishes the core promise: attention can be verified, valued, and rewarded.',func:['Introduces the brand identity.','Communicates the value promise instantly.','Single tap moves user into the app.'],feature:'A minimal entry screen with the [ i ] mark, motion-like attention rings, and a clear “Tap to continue” action.',benefits:['Builds trust from the first moment.','Creates a premium app impression.','Reduces onboarding friction.'],takeaway:'Your attention has value. We verify it. You earn.',phone:'splash'},
{n:2,id:'Feed',title:'Feed Screen',desc:'The discovery hub where organic content and paid attention opportunities live together without feeling like intrusive ads.',func:['Shows organic and sponsored content.','Displays wallet balance and story filters.','Turns sponsored media into a clear earning opportunity.'],feature:'A social-style feed with a sponsored Nike card showing reward amount, watch requirement, and tap-to-earn affordance.',benefits:['Makes earning feel native to media consumption.','Highlights paid attention without breaking the feed.','Creates a simple entry point into the money loop.'],takeaway:'The feed is where attention becomes an asset.',phone:'feed'},
{n:3,id:'Offer Detail',title:'Offer Detail Screen',desc:'The campaign confirmation screen. It explains the reward, requirements, verification rules, and consent before the user watches.',func:['Shows full campaign details.','Explains watch time and attention verification.','Starts the verified attention journey.'],feature:'A clear Nike campaign detail page with reward math, verification notice, and Start Watching CTA.',benefits:['Reduces confusion before commitment.','Builds trust through transparent requirements.','Improves quality of verified attention.'],takeaway:'Users know what they earn and what must be verified.',phone:'offer'},
{n:4,id:'Watch / Verify',title:'Watch / Verify Screen',desc:'The core proprietary moment: the app verifies attention while the user watches paid content.',func:['Tracks watch progress.','Shows attention score in real time.','Locks reward until verification succeeds.'],feature:'A live attention HUD with score ring, eye-tracking indicator, progress timeline, and verification CTA.',benefits:['Makes verification visible and understandable.','Encourages full attention.','Signals fraud-resistant infrastructure.'],takeaway:'This is the verified attention engine.',phone:'watch'},
{n:5,id:'Verification Result',title:'Verification Result Screen',desc:'The proof layer. A five-gate engine confirms that real attention occurred before reward is unlocked.',func:['Checks presence, watch time, attention score, completion, and fraud flags.','Shows pass state for every verification gate.','Unlocks the reward CTA.'],feature:'A deterministic verification checklist that turns invisible validation into an investor-readable flow.',benefits:['Creates trust and credibility.','Explains why the reward is earned.','Makes anti-fraud logic easy to understand.'],takeaway:'No proof, no reward. All checks passed.',phone:'verify'},
{n:6,id:'Reward Reveal',title:'Reward Reveal Screen',desc:'The emotional payoff. The user sees the earned reward, source campaign, score, and transaction reference.',func:['Shows +2.00 iCoins earned.','Confirms Nike source and attention score.','Creates a transaction record.'],feature:'A coin unlock moment with glow, amount, campaign attribution, and Continue to Wallet CTA.',benefits:['Creates reward satisfaction.','Makes earnings feel real.','Connects attention proof to wallet value.'],takeaway:'Verified attention becomes wallet value.',phone:'reward'},
{n:7,id:'Wallet',title:'Wallet Screen',desc:'The financial home of the attention economy. It shows balances, pending value, actions, and transaction history.',func:['Displays iCoins, aCoins, pending value, and latest rewards.','Provides Convert, Withdraw, and Pay actions.','Records transaction history.'],feature:'A wallet dashboard designed around attention earnings and spend/convert utility.',benefits:['Proves the reward has destination and utility.','Builds trust through transparent records.','Turns the demo from content app into economy app.'],takeaway:'The wallet closes the money loop.',phone:'wallet'},
{n:8,id:'Convert',title:'Convert Screen',desc:'The bridge between earned attention currency and spendable wallet value.',func:['Converts aCoins into iCoins.','Shows estimated receive amount and reserve.','Uses trust-tier style explanation.'],feature:'A simulated conversion flow that explains internal currency movement without real payment risk.',benefits:['Clarifies currency utility.','Builds confidence in economy design.','Prepares users for future rails.'],takeaway:'Earned attention can move through the economy.',phone:'convert'},
{n:9,id:'Withdraw Preview',title:'Withdraw Preview Screen',desc:'A compliance-safe preview of future cash-out functionality. It is explicit that withdrawals are simulated in demo mode.',func:['Shows available withdrawal amount.','Previews payout method and estimated USD.','Explains KYC/trust requirements.'],feature:'A simulated withdrawal screen with clear demo-mode labeling and payout preview.',benefits:['Shows future financial utility without pretending money is live.','Builds regulatory clarity.','Sets realistic investor expectations.'],takeaway:'Cash-out is planned, but demo mode stays honest.',phone:'withdraw'},
{n:10,id:'Creator Economics',title:'Creator Economics Screen',desc:'The business model layer. It explains how campaign value is split between viewer, creator, platform, and fees.',func:['Shows campaign value distribution.','Explains viewer and creator earnings.','Makes platform economics visible.'],feature:'A split visualization that demonstrates a fairer attention marketplace.',benefits:['Builds investor confidence.','Shows creator support.','Makes the marketplace mechanics understandable.'],takeaway:'Brands buy verified attention; users and creators both participate.',phone:'economics'},
{n:11,id:'Roadmap',title:'Roadmap Screen',desc:'The final investor narrative: what is already demonstrated now and what becomes possible after funding.',func:['Separates built-now features from post-funding roadmap.','Communicates product maturity and next milestones.','Frames the investment story.'],feature:'A concise built-now versus after-funding roadmap screen.',benefits:['Creates confidence and clarity.','Shows ambition without overclaiming.','Ends the demo with a credible path forward.'],takeaway:'MVP proves the loop. Funding scales the economy.',phone:'roadmap'}];
let idx=0,timer=null;const $=s=>document.querySelector(s);
function status(){return `<div class="status"><span>9:41</span><span>▮▮ Wi‑Fi ▰</span></div>`}
function phone(kind){
 if(kind==='splash')return `${status()}<div class="logoCenter"><div class="ringLogo"><span>[i]</span></div><div><p>Your attention.</p><h2><span class="green">Verified.</span> Rewarded.</h2><p>Your choice.</p></div></div><div class="cta">Tap to continue</div>`;
 if(kind==='feed')return `${status()}<div class="row"><div class="mark">[i]</div><div class="pill"><span class="green">●</span> <b class="mono green">847</b></div></div><div class="stories"><div class="story">You</div><div class="story">Nike</div><div class="story">RB</div><div class="story">Tech</div><div class="story">Run</div></div><div class="filters"><span class="filter active">All</span><span class="filter">For You</span><span class="filter">Earn</span><span class="filter">Sports</span></div><div class="feedcard"><div class="media"><div class="play"></div></div><div class="feedbody"><b>Morning rituals for better focus</b><p class="sub">Organic creator post</p></div></div><div class="feedcard"><div class="media"><span class="pill" style="position:absolute;left:12px;top:12px">▶ YouTube · Sponsored</span><span class="pill" style="position:absolute;right:12px;top:12px">4:30</span><div class="play"></div><span class="pill mono green" style="position:absolute;right:12px;bottom:12px">+2.00 iCoins</span></div><div class="feedbody"><b>Nike Running</b><p class="sub">Pegasus 41 · Watch to earn</p><div class="timeline"><span></span></div></div></div>`;
 if(kind==='offer')return `${status()}<p class="sub">‹ Feed</p><h2 class="screenTitle">Nike Running</h2><p class="sub">Pegasus 41 Campaign</p><div class="media" style="height:190px"><div class="shoe">👟</div></div><h2 class="green mono">+2.00 iCoins</h2><div class="metricBox miniRows"><div class="miniRow"><span>Required watch time</span><b>4:30</b></div><div class="miniRow"><span>Attention verification</span><b>Required</b></div><div class="miniRow"><span>Reward probability</span><b>100%</b></div></div><p class="sub">I consent to attention verification using demo gaze checks.</p><div class="cta greenBtn">Start Watching</div>`;
 if(kind==='watch')return `${status()}<p class="sub">‹ Offer</p><h2 class="screenTitle">Watching & Verifying</h2><p class="sub">Your attention is being verified in real time.</p><div class="attention"><div class="bigRing"><div class="score"><b>87</b><br><span class="green">/100</span><br><small>Attention Score</small></div></div><p class="sub">Eye tracking active · Reward locked</p><div class="timeline" style="width:100%"><span></span></div></div><div class="metricBox"><b>Reward locked</b><p class="sub">Complete verification to unlock +2.00 iCoins</p></div><div class="cta greenBtn">Complete & Verify</div>`;
 if(kind==='verify')return `${status()}<p class="sub">‹ Watch</p><h2 class="screenTitle">Verification Result</h2><p class="sub">Our 5-layer verification engine results</p>${['Presence detected','Required watch time met','Attention score passed','Completion received','Fraud flags clean'].map((x,i)=>`<div class="gate"><div class="check">✓</div><div><b>${i+1}. ${x}</b><p class="sub">${i===4?'No suspicious behavior':'Passed'}</p></div></div>`).join('')}<h2 class="green">All checks passed</h2><div class="cta greenBtn">Claim Reward</div>`;
 if(kind==='reward')return `${status()}<p class="sub">‹ Verify</p><h2 class="screenTitle">Reward Unlocked</h2><div class="coin"><div class="coinOrb"><span>[i]</span></div><h1 class="green mono">+2.00</h1><p>iCoins earned</p></div><div class="metricBox miniRows"><div class="miniRow"><span>Source</span><b>Nike Running</b></div><div class="miniRow"><span>Attention Score</span><b>87 / 100</b></div><div class="miniRow"><span>Transaction</span><b>TXN‑14F7...</b></div></div><div class="cta greenBtn">Continue to Wallet</div>`;
 if(kind==='wallet')return `${status()}<h2 class="screenTitle">Wallet</h2><div class="metricBox"><p class="sub">Available Balance</p><div class="balance">24.75 iCoins</div><p class="sub">≈ $24.75</p></div><div class="row"><div class="metricBox"><b>iCoins</b><p class="mono green">24.75</p></div><div class="metricBox"><b>aCoins</b><p class="mono">12.40</p></div><div class="metricBox"><b>Pending</b><p class="mono">3.20</p></div></div><div class="actions"><div class="action green">Convert</div><div class="action">Withdraw</div><div class="action">Pay</div></div><h3>Latest Transaction</h3><div class="gate"><div class="check">✓</div><div><b>Nike Running</b><p class="sub">+2.00 iCoins · Pegasus 41</p></div></div>`;
 if(kind==='convert')return `${status()}<p class="sub">‹ Wallet</p><h2 class="screenTitle">Convert aCoins</h2><div class="metricBox"><p>Convert your aCoins to iCoins</p><h2 class="mono">10 <span class="sub">aCoins</span></h2></div><div class="metricBox miniRows"><div class="miniRow"><span>You receive</span><b>9.50 iCoins</b></div><div class="miniRow"><span>Rate</span><b>0.95</b></div><div class="miniRow"><span>Reserve</span><b>98.7%</b></div></div><p class="sub">This is a simulated conversion.</p><div class="cta greenBtn">Convert Now</div>`;
 if(kind==='withdraw')return `${status()}<p class="sub">‹ Wallet</p><h2 class="screenTitle">Withdraw Preview</h2><span class="pill green">Simulated Withdrawal</span><div class="metricBox"><p class="sub">You are withdrawing</p><div class="balance">10.00 iCoins</div><p class="sub">≈ $10.00</p></div><h2 class="green mono">$9.80 USD</h2><div class="metricBox"><b>Method</b><p class="sub">USDC (Polygon) · **** 9571</p></div><p class="sub">KYC required for real withdrawals. This is demo preview only.</p><div class="cta greenBtn">Continue (Demo)</div>`;
 if(kind==='economics')return `${status()}<p class="sub">‹ Wallet</p><h2 class="screenTitle">Creator Economics</h2><div class="metricBox"><p>Every campaign supports creators and users.</p><h2 class="mono">+2.00 iCoins</h2></div><div class="split"><div>Viewer earns <b class="green">50%</b><div class="splitLine"><span style="width:50%"></span></div></div><div>Creator earns <b class="green">30%</b><div class="splitLine"><span style="width:30%"></span></div></div><div>Platform <b class="green">15%</b><div class="splitLine"><span style="width:15%"></span></div></div><div>Brand / Fees <b class="green">5%</b><div class="splitLine"><span style="width:5%"></span></div></div></div><div class="metricBox"><p>Real attention. Fair value. Sustainable for everyone.</p></div>`;
 return `${status()}<p class="sub">‹ Home</p><h2 class="screenTitle">Roadmap</h2><h3 class="green">Built Now</h3><div class="roadlist">${['Watch to earn','Verified attention','iCoins wallet','Convert aCoins → iCoins','Withdraw preview','Creator economics'].map(x=>`<div class="roaditem"><div class="check">✓</div>${x}</div>`).join('')}</div><h3 class="green">After Funding</h3><div class="roadlist">${['Real withdrawals','KYC & compliance','More campaigns','Creator studio','API for developers','Global scaling'].map(x=>`<div class="roaditem"><span>○</span>${x}</div>`).join('')}</div><div class="metricBox"><p>Build the attention economy. Reward real humans.</p></div>`;
}
function render(){const s=screens[idx];$('#phoneScreen').innerHTML=phone(s.phone);$('#kicker').textContent=`Screen ${s.n} of ${screens.length} · ${s.id}`;$('#title').textContent=s.title;$('#desc').textContent=s.desc;$('#func').innerHTML=s.func.map(x=>`<li>${x}</li>`).join('');$('#feature').textContent=s.feature;$('#benefits').innerHTML=s.benefits.map(x=>`<li>${x}</li>`).join('');$('#takeaway').innerHTML=`<strong>${s.takeaway}</strong>`;$('#bar').style.width=`${((idx+1)/screens.length)*100}%`;$('#dots').innerHTML=screens.map((d,i)=>`<button class="dot ${i===idx?'active':''}" onclick="go(${i})">${d.n}</button>`).join('')}
function go(i){idx=(i+screens.length)%screens.length;render()}function next(){go(idx+1)}function prev(){go(idx-1)}$('#next').onclick=next;$('#prev').onclick=prev;$('#phone').onclick=next;$('#auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#auto').textContent='Auto loop: off';$('#auto').classList.remove('on')}else{timer=setInterval(next,4200);$('#auto').textContent='Auto loop: on';$('#auto').classList.add('on')}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});render();
</script>
</body>
</html>
